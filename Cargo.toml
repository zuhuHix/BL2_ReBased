# BL2_ReBased Rust workspace (decision 2026-11-14-01: Rust replaces the UE5 host).
#
# The crates port the C++ core in src/ one at a time; src/ stays the reference until a crate matches it on the same
# synthetic fixtures and on tools/verify_packages.py. No third-party crates: each one added later needs its
# THIRD_PARTY.md entry first (AGENTS.md rule 6). The host's engine route is an own engine on wgpu + winit, picked
# 2026-11-15 from the Phase 0R benchmark (docs/verification/ENGINE_BENCHMARK.md, decision 2026-11-15-01).
#
# The 22 crates and their allowed dependency edges are listed in crates/README.md; tests/crate_edges_test.py fails on
# an edge outside that table.
[workspace]
resolver = "3"
members = [
    "crates/ow-core",
    "crates/ow-container",
    "crates/ow-package",
    "crates/ow-object",
    "crates/ow-script",
    "crates/ow-defs",
    "crates/ow-attr",
    "crates/ow-balance",
    "crates/ow-items",
    "crates/ow-vm",
    "crates/ow-world",
    "crates/ow-inventory",
    "crates/ow-behavior",
    "crates/ow-combat",
    "crates/ow-skills",
    "crates/ow-ai",
    "crates/ow-mission",
    "crates/ow-save",
    "crates/ow-ui",
    "crates/ow-assets",
    "crates/ow-cli",
    "crates/ow-host",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
