[package]
name = "ow-combat"
description = "Firing maths, hit chain, damage, death, down state, respawn, loot on death, damage-dealing behavior handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The whole allowed closure of architecture section 2.2, declared once by W0-SCAFFOLD:
