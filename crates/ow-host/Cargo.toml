[package]
name = "ow-host"
description = "The Rust host. Engine route: own engine on wgpu + winit (picked 2026-11-15); not written yet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ow-host"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# The whole allowed closure of architecture section 2.2, declared once by W0-SCAFFOLD:
# no later lane edits this file (tests/crate_edges_test.py checks it).
[dependencies]
ow-core = { path = "../ow-core" }
ow-container = { path = "../ow-container" }
ow-package = { path = "../ow-package" }
ow-object = { path = "../ow-object" }
ow-script = { path = "../ow-script" }
ow-defs = { path = "../ow-defs" }
ow-attr = { path = "../ow-attr" }
ow-balance = { path = "../ow-balance" }
ow-items = { path = "../ow-items" }
ow-vm = { path = "../ow-vm" }
ow-world = { path = "../ow-world" }
ow-inventory = { path = "../ow-inventory" }
ow-behavior = { path = "../ow-behavior" }
ow-combat = { path = "../ow-combat" }
ow-skills = { path = "../ow-skills" }
ow-ai = { path = "../ow-ai" }
ow-mission = { path = "../ow-mission" }
ow-save = { path = "../ow-save" }
ow-ui = { path = "../ow-ui" }
ow-assets = { path = "../ow-assets" }

[dev-dependencies]
ow-package = { path = "../ow-package", features = ["test-support"] }
