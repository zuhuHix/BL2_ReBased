[package]
name = "ow-host"
description = "The Rust host: own engine on wgpu + winit (route picked 2026-11-15); window, device and frame loop (H1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ow-host"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# The whole allowed closure of architecture section 2.2, declared once by W0-SCAFFOLD, plus the two engine crates
# lane H1 added (maintainer approval 2026-11-16, THIRD_PARTY.md "Engine crates: wgpu and winit"). Engine crates live
# only here; tests/crate_edges_test.py refuses any other third-party crate, and these two anywhere else.
[dependencies]
# Engine crates, pinned exactly, default features (the benchmark built on them; no feature was needed beyond them).
wgpu = "=30.0.1"
winit = "=0.30.13"
ow-core = { path = "../ow-core" }
ow-container = { path = "../ow-container" }
ow-package = { path = "../ow-package" }
ow-object = { path = "../ow-object" }
ow-script = { path = "../ow-script" }
ow-defs = { path = "../ow-defs" }
ow-attr = { path = "../ow-attr" }
ow-balance = { path = "../ow-balance" }
ow-items = { path = "../ow-items" }
ow-vm = { path = "../ow-vm" }
ow-world = { path = "../ow-world" }
ow-inventory = { path = "../ow-inventory" }
ow-behavior = { path = "../ow-behavior" }
ow-combat = { path = "../ow-combat" }
ow-skills = { path = "../ow-skills" }
ow-ai = { path = "../ow-ai" }
ow-mission = { path = "../ow-mission" }
ow-save = { path = "../ow-save" }
ow-ui = { path = "../ow-ui" }
ow-assets = { path = "../ow-assets" }

[dev-dependencies]
ow-package = { path = "../ow-package", features = ["test-support"] }
