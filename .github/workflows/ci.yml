name: CI

# Builds the package reader and runs every synthetic test suite. Nothing here
# touches a Borderlands 2 installation: the differential check against real
# packages (tools/verify_packages.py) is a local, human-run step and is
# reported in pull requests, not in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows / MSVC / LZO=${{ matrix.lzo }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lzo: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Test-only tools (maintainer approval 2026-11-11): Node runs tests/*_test.js and numpy the Python tests that import
      # it (CMakeLists.txt, OW_NODE_TESTS and OW_NUMPY_PY_TESTS). Neither is used by the build.
      - uses: actions/setup-node@v6
        with:
          node-version: "26.4.0"
          package-manager-cache: false

      - name: Install numpy for the tests that need it
        run: python -m pip install numpy==2.5.4

      # Pillow for the tests in OW_PILLOW_PY_TESTS (lane ci-test-deps commit 2: lands only with the maintainer's yes).
      - name: Install Pillow for the tests that need it
        run: python -m pip install pillow==12.2.0

      - name: Configure
        # Default generator: whichever Visual Studio the runner image ships.
        run: cmake -S . -B build -A x64 -DOPENWILLOW_LZO=${{ matrix.lzo }} -DOW_REQUIRE_TEST_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Synthetic CTest suites
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Case counts of the tests labelled needs-*
        # The tests that need Node or a Python module must run every case: any skip fails the job. Each entry's case count
        # comes from unittest's "Ran N tests", else the test's own "N passed" line; a test that prints no count says so.
        if: always()
        shell: pwsh
        run: |
          $log = Get-Content build/Testing/Temporary/LastTest.log -Raw
          $names = @(ctest --test-dir build -C Release -N -L 'needs-' | Select-String 'Test +#\d+: (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $bad = 0
          foreach ($name in $names) {
            $m = [regex]::Match($log, "(?ms)^\d+/\d+ Test: $([regex]::Escape($name))\r?\n.*?^Output:\r?\n-+\r?\n(.*?)^<end of output>")
            if (-not $m.Success) { "$name | FAIL: no output in LastTest.log"; $bad++; continue }
            $out = $m.Groups[1].Value
            $lines = @($out -split '\r?\n' | Where-Object { $_.Trim() })
            $summary = $lines | Where-Object { $_ -cmatch '\d+(/\d+)? .*passed' } | Select-Object -Last 1
            if ($out -cmatch 'Ran (\d+) tests?') { $cases = "$($Matches[1]) (unittest)" }
            elseif ($summary -and $summary -cmatch '(\d+)(/\d+)? ') { $cases = "$($Matches[1]) (its summary line)" }
            else { $cases = 'no count printed' }
            $skips = if ($out -cmatch 'skipped=(\d+)') { [int]$Matches[1] } else { 0 }
            if ($skips) { $bad++ }
            "$name | cases: $cases | skipped: $skips | last: $(($lines | Select-Object -Last 2) -join ' / ')"
          }
          "$($names.Count) entries labelled needs-*"
          if ($bad) { throw "$bad needs-* entries skipped cases or left no output" }

      - name: Scene preparation unit tests
        run: python tests/level_test.py

      - name: Map selector unit tests
        run: python tests/viewer_test.py

      - name: Reader refuses to run without arguments
        shell: bash
        run: |
          if ./build/Release/ow-package.exe; then
            echo "expected a non-zero exit with no arguments"; exit 1
          fi

  leak-gate:
    # tools/leak_gate.py (docs/TOOLING.md, "Leak gate"): game files, decompiler output, dumps and personal
    # identifiers. A separate job with no path filter, so it can be made a required check. The gate script and its
    # lists come from the trusted commit (the pull request's base, or the commit main held before a push), so a
    # change cannot weaken the check that judges it. Only while that commit holds no gate does the job bootstrap
    # with the change's own copy, and it says so. This job runs after publication: it is detection, not prevention.
    name: Leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pick the trusted gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TRUSTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          GATE="$RUNNER_TEMP/leak_gate.py"
          TRUSTED="${TRUSTED_SHA:-}"
          RANGE_MODE=range
          # A stacked pull request's base is its parent branch: that branch's gate and lists judge it.
          if [ "$EVENT" = workflow_dispatch ]; then
            TRUSTED=$(git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" || true)
            echo "WARN a manual run: every commit the head reaches is judged, with main's gate and lists"
            RANGE_MODE=whole
          elif [ "$TRUSTED" = "0000000000000000000000000000000000000000" ]; then
            echo "WARN a first push: no earlier main exists, so every commit is judged with the head's own gate and lists"
            TRUSTED=""
            RANGE_MODE=whole
          elif [ -n "$TRUSTED" ] && ! git cat-file -e "$TRUSTED^{commit}" 2>/dev/null; then
            git fetch --quiet origin "$TRUSTED" 2>/dev/null || true
            if ! git cat-file -e "$TRUSTED^{commit}" 2>/dev/null; then
              echo "::error::the trusted commit (the base, or main before this push) cannot be fetched: nothing was judged"
              exit 1
            fi
          fi
          if [ -n "$TRUSTED" ] && git cat-file -e "$TRUSTED:tools/leak_gate.py" 2>/dev/null; then
            git show "$TRUSTED:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$TRUSTED"
          elif [ -n "$TRUSTED" ]; then
            echo "WARN BOOTSTRAP: the trusted commit $TRUSTED holds no gate; judging with the gate and lists of $HEAD_SHA"
            git show "$HEAD_SHA:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$HEAD_SHA"
          else
            echo "WARN no trusted commit for this event; judging with the gate and lists of $HEAD_SHA"
            git show "$HEAD_SHA:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$HEAD_SHA"
          fi
          {
            echo "LEAK_GATE=$GATE"
            echo "TRUSTED_SHA=$TRUSTED"
            echo "CONFIG_FROM=$CONFIG_FROM"
            echo "RANGE_MODE=$RANGE_MODE"
            echo "HEAD_SHA=$HEAD_SHA"
          } >> "$GITHUB_ENV"

      - name: Commits, added lines and blobs
        shell: bash
        run: |
          if [ "$RANGE_MODE" = whole ]; then
            python -I "$LEAK_GATE" --range "..$HEAD_SHA" --whole-history --config-from "$CONFIG_FROM"
          elif [ -n "$TRUSTED_SHA" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            # After a push to main the checkout's origin/main already sits at the pushed head: the range's own base
            # (main before the push) bounds the walk, so the trusted-ref exclusion is turned off.
            python -I "$LEAK_GATE" --range "$TRUSTED_SHA..$HEAD_SHA" --config-from "$CONFIG_FROM" --no-trusted-exclude
          elif [ -n "$TRUSTED_SHA" ]; then
            python -I "$LEAK_GATE" --range "$TRUSTED_SHA..$HEAD_SHA" --config-from "$CONFIG_FROM"
          else
            echo "::error::no trusted commit to judge the range against (an event without a base): nothing was judged"
            exit 1
          fi

      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | python -I "$LEAK_GATE" --text - --label pr-description --config-from "$CONFIG_FROM"

      - name: Whole tree against the baseline
        if: github.event_name != 'pull_request'
        run: python -I "$LEAK_GATE" --all HEAD --config-from "$CONFIG_FROM"
