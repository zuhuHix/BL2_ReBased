name: CI

# Builds the package reader and runs every synthetic test suite. Nothing here
# touches a Borderlands 2 installation: the differential check against real
# packages (tools/verify_packages.py) is a local, human-run step and is
# reported in pull requests, not in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on its older head. Every other run (a push to main, a manual run) gets a
# group of its own, its run id, so it is never cancelled, neither mid-way nor while queued: GitHub keeps only one pending
# run per group, so a shared main group would drop a queued main run when the next push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether the Windows jobs run. Only a pull request whose every changed path is documentation skips them:
    # a path under docs/ other than docs/TOOLING.md (tests/real_game_migration_test.py reads that one), or a *.md file
    # at the top level. Pushes to main, manual runs, an empty diff and any other path run everything. Plain git, no
    # third-party action. The leak gate does not depend on this job.
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Docs-only or code
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "a $EVENT run: every job runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: the paths the pull request changes since it left its base, as the pull request page lists them.
          # --no-renames lists both sides of a rename, so moving a file into docs/ (or docs/TOOLING.md away) is code.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          total=$(wc -l < "$RUNNER_TEMP/changed.txt")
          code=$(grep -v -E '^docs/|^[^/]+\.md$' "$RUNNER_TEMP/changed.txt" | wc -l || true)
          tooling=$(grep -c -x 'docs/TOOLING.md' "$RUNNER_TEMP/changed.txt" || true)
          echo "$total changed path(s); $code outside docs/ and the top-level *.md files; docs/TOOLING.md changed: $tooling"
          if [ "$total" -gt 0 ] && [ "$code" -eq 0 ] && [ "$tooling" -eq 0 ]; then
            echo "docs-only: the Windows jobs are skipped, the leak gate runs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    # The two legs split ctest (labels in tests/CMakeLists.txt). LZO=ON runs every entry. LZO=OFF runs only the entries
    # labelled cxx-binary, which run a binary built from src/ and so can change with OPENWILLOW_LZO; the Python, Node
    # and Rust-only entries do not depend on it and run once, in the LZO=ON leg.
    name: Windows / MSVC / LZO=${{ matrix.lzo }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lzo: "ON"
            ctest_select: ""
          - lzo: "OFF"
            ctest_select: "-L cxx-binary"
    env:
      CTEST_SELECT: ${{ matrix.ctest_select }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Test-only tools (maintainer approval 2026-11-11): Node runs tests/*_test.js and numpy the Python tests that import
      # it (CMakeLists.txt, OW_NODE_TESTS and OW_NUMPY_PY_TESTS). Neither is used by the build.
      - uses: actions/setup-node@v6
        with:
          node-version: "26.4.0"
          package-manager-cache: false

      - name: Install numpy for the tests that need it
        run: python -m pip install numpy==2.5.4

      # Pillow for the tests in OW_PILLOW_PY_TESTS (lane ci-test-deps commit 2: lands only with the maintainer's yes).
      - name: Install Pillow for the tests that need it
        run: python -m pip install pillow==12.2.0

      # The Rust release binary for ctest's rust-parity entry (maintainer decision D15, lane W1-HARNESS): configure
      # registers that entry only when target/release/ow-package.exe exists, and OW_REQUIRE_TEST_TOOLS=ON fails the
      # configure without it. The entry runs tools/rust_parity.py over tests/rust_parity.d/ in the ctest step below.
      # The cargo registry and target/ (lane CI-OPTIMIZE, maintainer approval 2026-11-19 for actions/cache). Both legs
      # build the same release binary, so they share one key; only the LZO=ON leg saves it (the OFF leg restores only),
      # so the two never race to write it. The key changes with Cargo.lock and the toolchain. A checkout gives every
      # source file a new time stamp, so cargo rebuilds the workspace crates anyway: the cache saves the third-party
      # crates' download and build. --locked stays on every cargo call.
      - name: Cargo cache (restore and save)
        if: matrix.lzo == 'ON'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msvc-release-

      - name: Cargo cache (restore only)
        if: matrix.lzo != 'ON'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msvc-release-

      - name: Rust release binary for the parity manifest
        run: cargo build --release -p ow-cli --locked

      - name: Configure
        # Default generator: whichever Visual Studio the runner image ships.
        run: cmake -S . -B build -A x64 -DOPENWILLOW_LZO=${{ matrix.lzo }} -DOW_REQUIRE_TEST_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # A fresh checkout has no ignored local/ folder. Some tests write below it (a temporary folder each) and one
      # skips its cases without it; with ctest's parallel run the test that used to create it first no longer runs
      # first, so the folder is made here, as every working checkout has it.
      - name: The ignored local/ folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force local | Out-Null

      - name: Synthetic CTest suites
        # In parallel, one entry per runner core. CTEST_SELECT is this leg's share (the matrix above).
        shell: pwsh
        run: |
          $select = @("$env:CTEST_SELECT" -split ' ' | Where-Object { $_ })
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --parallel $env:NUMBER_OF_PROCESSORS @select
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Case counts of the tests labelled needs-*
        # The tests that need Node or a Python module must run every case: any skip fails the job. Each entry's case count
        # comes from unittest's "Ran N tests", else the test's own "N passed" line; a test that prints no count says so.
        # It checks every needs-* entry of this leg's share (CTEST_SELECT): all of them in LZO=ON, none in LZO=OFF.
        if: always()
        shell: pwsh
        run: |
          $log = Get-Content build/Testing/Temporary/LastTest.log -Raw
          $select = @("$env:CTEST_SELECT" -split ' ' | Where-Object { $_ })
          $names = @(ctest --test-dir build -C Release -N -L 'needs-' @select | Select-String 'Test +#\d+: (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $bad = 0
          foreach ($name in $names) {
            $m = [regex]::Match($log, "(?ms)^\d+/\d+ Test: $([regex]::Escape($name))\r?\n.*?^Output:\r?\n-+\r?\n(.*?)^<end of output>")
            if (-not $m.Success) { "$name | FAIL: no output in LastTest.log"; $bad++; continue }
            $out = $m.Groups[1].Value
            $lines = @($out -split '\r?\n' | Where-Object { $_.Trim() })
            $summary = $lines | Where-Object { $_ -cmatch '\d+(/\d+)? .*passed' } | Select-Object -Last 1
            if ($out -cmatch 'Ran (\d+) tests?') { $cases = "$($Matches[1]) (unittest)" }
            elseif ($summary -and $summary -cmatch '(\d+)(/\d+)? ') { $cases = "$($Matches[1]) (its summary line)" }
            else { $cases = 'no count printed' }
            $skips = if ($out -cmatch 'skipped=(\d+)') { [int]$Matches[1] } else { 0 }
            if ($skips) { $bad++ }
            "$name | cases: $cases | skipped: $skips | last: $(($lines | Select-Object -Last 2) -join ' / ')"
          }
          "$($names.Count) entries labelled needs-*"
          if ($bad) { throw "$bad needs-* entries skipped cases or left no output" }

      # Python only, so once, in the LZO=ON leg.
      - name: Scene preparation unit tests
        if: matrix.lzo == 'ON'
        run: python tests/level_test.py

      - name: Map selector unit tests
        if: matrix.lzo == 'ON'
        run: python tests/viewer_test.py

      - name: Reader refuses to run without arguments
        shell: bash
        run: |
          if ./build/Release/ow-package.exe; then
            echo "expected a non-zero exit with no arguments"; exit 1
          fi

  rust-workspace:
    # The Cargo workspace (decision 2026-11-14-01: Rust replaces the UE5 host). rust-toolchain.toml pins the toolchain;
    # the runner image's rustup installs it on the first cargo call. The third-party crates in Cargo.lock (wgpu, winit
    # and what they pull in, THIRD_PARTY.md) come from crates.io, or from the cache below. --locked fails the job if
    # Cargo.lock is out of date.
    name: Windows / Rust workspace
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # No incremental-compilation data: a checkout's new time stamps make cargo rebuild the workspace crates in full
      # anyway, and that data (several GB) would not fit the cache. It changes how cargo compiles, not what it builds.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5

      # Same cache as the MSVC legs' (see there), under this job's own key: a debug build of the whole workspace and its
      # tests.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-workspace-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-workspace-

      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: ow-host refuses to start without the game
        shell: bash
        run: |
          if cargo run --locked -q -p ow-host -- --game "$RUNNER_TEMP/no-game-here"; then
            echo "expected ow-host to refuse a folder that is not a Borderlands 2 install"; exit 1
          fi

      # The last step: the cache step above saves target/ after it, at the end of the job. The workspace crates' own
      # artifacts (about 3 GB of the 4 GB in target/debug/deps on the zuhu desktop) are rebuilt after every checkout,
      # so only the third-party crates are kept. Workspace artifacts are named ow_* / libow_* (deps), ow-* (fingerprints
      # and the binaries); the one third-party crate whose name starts with "ow", owned_ttf_parser, matches neither.
      - name: Keep only the third-party crates in target/ for the cache
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target/debug/deps/ow_*, target/debug/deps/libow_*, target/debug/.fingerprint/ow-*, target/debug/ow-*
          "target/debug after pruning: {0:N0} MB" -f ((Get-ChildItem target/debug -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

  leak-gate:
    # tools/leak_gate.py (docs/TOOLING.md, "Leak gate"): game files, decompiler output, dumps and personal
    # identifiers. A separate job with no path filter, so it can be made a required check. The gate script and its
    # lists come from the trusted commit (the pull request's base, or the commit main held before a push), so a
    # change cannot weaken the check that judges it. Only while that commit holds no gate does the job bootstrap
    # with the change's own copy, and it says so. This job runs after publication: it is detection, not prevention.
    name: Leak gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pick the trusted gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TRUSTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          GATE="$RUNNER_TEMP/leak_gate.py"
          TRUSTED="${TRUSTED_SHA:-}"
          RANGE_MODE=range
          # A stacked pull request's base is its parent branch: that branch's gate and lists judge it.
          if [ "$EVENT" = workflow_dispatch ]; then
            TRUSTED=$(git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" || true)
            echo "WARN a manual run: every commit the head reaches is judged, with main's gate and lists"
            RANGE_MODE=whole
          elif [ "$TRUSTED" = "0000000000000000000000000000000000000000" ]; then
            echo "WARN a first push: no earlier main exists, so every commit is judged with the head's own gate and lists"
            TRUSTED=""
            RANGE_MODE=whole
          elif [ -n "$TRUSTED" ] && ! git cat-file -e "$TRUSTED^{commit}" 2>/dev/null; then
            git fetch --quiet origin "$TRUSTED" 2>/dev/null || true
            if ! git cat-file -e "$TRUSTED^{commit}" 2>/dev/null; then
              echo "::error::the trusted commit (the base, or main before this push) cannot be fetched: nothing was judged"
              exit 1
            fi
          fi
          if [ -n "$TRUSTED" ] && git cat-file -e "$TRUSTED:tools/leak_gate.py" 2>/dev/null; then
            git show "$TRUSTED:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$TRUSTED"
          elif [ -n "$TRUSTED" ]; then
            echo "WARN BOOTSTRAP: the trusted commit $TRUSTED holds no gate; judging with the gate and lists of $HEAD_SHA"
            git show "$HEAD_SHA:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$HEAD_SHA"
          else
            echo "WARN no trusted commit for this event; judging with the gate and lists of $HEAD_SHA"
            git show "$HEAD_SHA:tools/leak_gate.py" > "$GATE"
            CONFIG_FROM="$HEAD_SHA"
          fi
          {
            echo "LEAK_GATE=$GATE"
            echo "TRUSTED_SHA=$TRUSTED"
            echo "CONFIG_FROM=$CONFIG_FROM"
            echo "RANGE_MODE=$RANGE_MODE"
            echo "HEAD_SHA=$HEAD_SHA"
          } >> "$GITHUB_ENV"

      - name: Commits, added lines and blobs
        shell: bash
        run: |
          if [ "$RANGE_MODE" = whole ]; then
            python -I "$LEAK_GATE" --range "..$HEAD_SHA" --whole-history --config-from "$CONFIG_FROM"
          elif [ -n "$TRUSTED_SHA" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            # After a push to main the checkout's origin/main already sits at the pushed head: the range's own base
            # (main before the push) bounds the walk, so the trusted-ref exclusion is turned off.
            python -I "$LEAK_GATE" --range "$TRUSTED_SHA..$HEAD_SHA" --config-from "$CONFIG_FROM" --no-trusted-exclude
          elif [ -n "$TRUSTED_SHA" ]; then
            python -I "$LEAK_GATE" --range "$TRUSTED_SHA..$HEAD_SHA" --config-from "$CONFIG_FROM"
          else
            echo "::error::no trusted commit to judge the range against (an event without a base): nothing was judged"
            exit 1
          fi

      - name: Pull request title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | python -I "$LEAK_GATE" --text - --label pr-description --config-from "$CONFIG_FROM"

      - name: Whole tree against the baseline
        if: github.event_name != 'pull_request'
        run: python -I "$LEAK_GATE" --all HEAD --config-from "$CONFIG_FROM"
