name: CI

# Builds the package reader and runs every synthetic test suite. Nothing here
# touches a Borderlands 2 installation: the differential check against real
# packages (tools/verify_packages.py) is a local, human-run step and is
# reported in pull requests, not in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows / MSVC / LZO=${{ matrix.lzo }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        lzo: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Test-only tools (maintainer approval 2026-11-11): Node runs tests/*_test.js and numpy the Python tests that import
      # it (CMakeLists.txt, OW_NODE_TESTS and OW_NUMPY_PY_TESTS). Neither is used by the build.
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install numpy for the tests that need it
        run: python -m pip install numpy==2.5.4

      # Pillow for the tests in OW_PILLOW_PY_TESTS (lane ci-test-deps commit 2: lands only with the maintainer's yes).
      - name: Install Pillow for the tests that need it
        run: python -m pip install pillow==12.2.0

      - name: Configure
        # Default generator: whichever Visual Studio the runner image ships.
        run: cmake -S . -B build -A x64 -DOPENWILLOW_LZO=${{ matrix.lzo }}

      - name: Build
        run: cmake --build build --config Release

      - name: Synthetic CTest suites
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Case lines of the tests that need Node, numpy or Pillow
        # A test that skips itself must not pass having run nothing: compare these lines with a local run.
        if: always()
        shell: pwsh
        run: |
          $log = Get-Content build/Testing/Temporary/LastTest.log -Raw
          $names = ctest --test-dir build -C Release -N -L 'needs-' | Select-String 'Test +#\d+: (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          foreach ($name in $names) {
            $m = [regex]::Match($log, "(?ms)^\d+/\d+ Test: $([regex]::Escape($name))\r?\n.*?^Output:\r?\n-+\r?\n(.*?)^<end of output>")
            $lines = @($m.Groups[1].Value -split '\r?\n' | Where-Object { $_.Trim() })
            $cases = @($lines | Where-Object { $_ -match '^(ok|PASS)\b' }).Count
            "$name | ok/PASS lines: $cases | last: $(($lines | Select-Object -Last 2) -join ' / ')"
          }
          "$(@($names).Count) entries labelled needs-*"

      - name: Scene preparation unit tests
        run: python tests/level_test.py

      - name: Map selector unit tests
        run: python tests/viewer_test.py

      - name: Reader refuses to run without arguments
        shell: bash
        run: |
          if ./build/Release/ow-package.exe; then
            echo "expected a non-zero exit with no arguments"; exit 1
          fi
