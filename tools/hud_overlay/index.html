<!doctype html>
<!--
  OpenWillow HUD overlay: runs BL2's converted HUD movie in Ruffle on a
  transparent page, for UE's in-game web browser (-owflashhud) or a normal
  browser. Our own code; the movie and Ruffle are served from ignored local/
  by tools/hud_overlay/serve.py.

  The host calls owHud(state) with any of these fields (all optional):
    health, shield, ammo, xp   fill fractions 0..1
    healthText, shieldText, ammoText, grenadeText, levelText, classModText   strings
    grenades                   fill fraction 0..1
    weaponOut                  bool
    weaponType                 the held weapon's ammo type key (pistol, smg, ar, shotgun, sniper, launcher)
    character                  frame (label or number) of p1.character; the game uses 6 for Maya
    skillActive                remaining fraction of the action skill's lock, null when the emblem is off
    skillCooldown              remaining fraction of the action-skill cooldown pool, 0 = ready
    skillIcon                  the class's HUD icon movie, e.g. "/ package/UI_HUD_AAIcons/AA-Siren"
                               (clip mapping in action_skill.js)
  Clip names and frame directions were observed in the Ruffle bench
  (DECISIONS.md 2026-09-26), not read from the game's scripts:
    health, shield, grenades, bullets: 100 bar frames, frame 1 full;
    shield/grenades frame 101 "none", bullets 103 "noWeapon";
    xpbar: 100 frames, frame N is N% full.
-->
<html><head><meta charset="utf-8"><title>OpenWillow HUD overlay</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden} ruffle-player{width:100%;height:100%;display:block}</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false,
    wmode: 'transparent', backgroundColor: null, letterbox: 'off', logLevel: 'error',
    contextMenu: 'off', allowScriptAccess: true };
</script>
<!-- Before ruffle.js: hud_warp.js asks for Ruffle's WebGL context with preserveDrawingBuffer so it can be read. -->
<script src="hud_warp.js"></script>
<script src="ruffle/ruffle.js"></script>
<script src="action_skill.js"></script>
<script src="hud3d.js"></script>
<script src="hud_fields.js"></script>
</head><body>
<script>
  const player = window.RufflePlayer.newest().createPlayer();
  document.body.appendChild(player);
  player.ruffle().load({ url: 'UI_HUD/harness.swf', base: 'UI_HUD/' });

  let ready = false;
  let pending = {};
  let turned = null, characterSet = false, readyAt = 0;  // the 3D-turn stand-in is applied once
  let warp = null, p1Origin = null, clipNames = [], warpReadAt = 0, warpKey = '';   // hud_warp.js, when it can read Ruffle's canvas
  const shown = {};   // every field applied so far: the warp re-reads its regions when this changes
  let skill = {}, lastSkillPage = '';   // the action-skill fields last applied (action_skill.js plans from the change)
  let lastHudPage = '';   // the last OWHUDPAGE line (hud_fields.js pageLine)
  const P1 = '_level1.p1';
  const call = (target, op, a, b) => player.ow(target, op, a, b);
  const setText = (field, text) => call(...window.owHudFields.textCall(field, text));
  // Bars whose frame 1 is full and frame 100 empty.
  const downFrame = fill => 1 + Math.round((1 - Math.min(1, Math.max(0, fill))) * 99);

  function apply(s) {
    if ('health' in s) call(P1 + '.health', 'gotoAndStop', downFrame(s.health));
    if ('shield' in s) call(P1 + '.shield', 'gotoAndStop', s.shield === null ? 'none' : downFrame(s.shield));
    if ('grenades' in s) call(P1 + '.grenades', 'gotoAndStop', s.grenades === null ? 'none' : downFrame(s.grenades));
    if ('xp' in s) call(P1 + '.xpbar', 'gotoAndStop', Math.max(1, Math.round(s.xp * 100)));
    if ('weaponOut' in s && !s.weaponOut) call(P1 + '.bullets', 'gotoAndStop', 'noWeapon');
    else if ('ammo' in s) call(P1 + '.bullets', 'gotoAndStop', downFrame(s.ammo));
    if ('character' in s) call(P1 + '.character', 'gotoAndStop', s.character);
    if ('weaponType' in s) for (const c of window.owHudFields.weaponCalls(s.weaponType)) call(c[0], c[1], c[2], c[3]);
    if ('healthText' in s) setText(P1 + '.health.health_disp', s.healthText);
    if ('shieldText' in s) setText(P1 + '.shield.shield_disp', s.shieldText);
    if ('ammoText' in s) setText(P1 + '.bullets.bullet_c', s.ammoText);
    if ('grenadeText' in s) setText(P1 + '.grenades.grenadesDisp', s.grenadeText);
    // XP bar caption: "LV" (lvdisp, localized in the movie), the level number
    // and the class-mod title ("LV 17 Hoarding War Dog" in the game).
    if ('levelText' in s) setText(P1 + '.levelClassMod.level', s.levelText);
    if ('classModText' in s) setText(P1 + '.levelClassMod.comm', s.classModText);
    // After `character`: the icon clip exists only on the character frame.
    const skillCalls = window.owActionSkill.plan(skill, s);
    for (const c of skillCalls) call(c[0], c[1], c[2], c[3]);
    for (const key of ['skillActive', 'skillCooldown', 'skillIcon']) if (key in s) skill[key] = s[key];
    // Acknowledge what the movie now shows: the state just applied and the frames read back from its clips (the host
    // logs the page's console; tools/check_action_skill_hud.py checks the frames against that state).
    if (skillCalls.length) {
      const aa = call(P1 + '.activeAbility', 'get', '_currentframe');
      const fixed = v => (v === null || v === undefined ? -1 : Number(v)).toFixed(2);
      const line = `OWSKILLPAGE active=${fixed(skill.skillActive)} cooldown=${fixed(skill.skillCooldown)}`
        + ` emblem=${aa} bar=${aa === 3 ? call(P1 + '.activeAbility.bar', 'get', '_currentframe') : 0}`
        + ` icon=${call(P1 + '.character.cooldown', 'get', '_currentframe')}`;
      if (line !== lastSkillPage) { console.log(line); lastSkillPage = line; }
    }
    // The stand-in for the clusters' 3D turn (hud3d.js), once the character frame is set and the clips have had a
    // second to settle (bounds read on the boot frame came out wrong in UE); the host resends its state every second.
    if ('character' in s) characterSet = true;
    // With the warp (hud_warp.js) the turned clips stay flat in the movie and the overlay draws their perspective;
    // the minimap keeps the stand-in either way.
    if (!turned && characterSet && performance.now() - readyAt > 1000) {
      clipNames = String(call(P1, 'keys')).split(',').filter(Boolean);
      p1Origin = {x: Number(call(P1, 'get', '_x')), y: Number(call(P1, 'get', '_y'))};
      // A serve.py started before hud_warp.js existed does not serve it: keep the stand-in then.
      warp = window.owHudWarp ? window.owHudWarp.start(player, console.log, /[?&]hud3d=affine(&|$)/.test(location.search))
        : {path: 'affine'};
      if (!window.owHudWarp) console.log('OpenWillow HUD 3D path affine: hud_warp.js not loaded');
      window.owHudWarpState = warp;
      const skip = new Set(warp.path === 'warp' ? clipNames.filter(n => n !== 'minimapEcho') : []);
      turned = window.owHud3d.apply(call, P1, clipNames, skip);
      console.log('OpenWillow HUD 3D turn on ' + turned.join(' ') + (warp.path === 'warp' ? ' (stand-in); warp for the rest' : ''));
    }
    // The warp's regions follow what the clips show. Reading them walks the turned clips' children (about 30 ms in the
    // bench), so only when the applied state changes (the host resends it every second) or every 5 s for the movie's
    // own animations.
    Object.assign(shown, s);
    // Acknowledge what the movie now shows for the host's fields (OWHUDPAGE; tools/check_hud_shots.py), once per change.
    const hudLine = window.owHudFields.pageLine(shown, (t, k) => call(t, 'get', k));
    if (hudLine !== lastHudPage) { console.log(hudLine); lastHudPage = hudLine; }
    const key = JSON.stringify(shown), now = performance.now();
    if (warp && warp.path === 'warp' && (key !== warpKey && now - warpReadAt > 250 || now - warpReadAt > 5000)) {
      warpKey = key; warpReadAt = now;
      const clips = window.owHudWarp.readClips(call, P1, clipNames, p1Origin, new Set(['minimapEcho']));
      // The minimap keeps its stand-in exactly: its drawn pixels stay in place.
      const minimap = window.owHudWarp.drawnRect(call, P1, 'minimapEcho');
      const regions = warp.setClips(clips, minimap ? [{name: 'minimapEcho', rect: minimap}] : []);
      const names = regions.map(r => r.name).join(' ');
      if (names !== warp.names) { warp.names = names; console.log('OpenWillow HUD 3D warp regions ' + names); }
    }
  }

  // The host may call before the movie is ready; keep the latest values.
  window.owHud = state => {
    Object.assign(pending, state);
    if (ready) { apply(pending); pending = {}; }
  };

  // Wait until the HUD has fully loaded (jumping to a frame that is still
  // streaming lands on it empty), then pick the 16:9 layout and hide the
  // boss bar, which shows by default.
  const boot = setInterval(() => {
    try {
      if (typeof player.ow !== 'function') return;
      const total = call('_level1', 'get', '_totalframes');
      if (!total || call('_level1', 'get', '_framesloaded') < total) return;
      if (call(P1, 'get', '_name') !== 'p1') {
        call('_level1', 'gotoAndStop', 'none');
        call('_level1', 'gotoAndStop', '16_9');
        return;
      }
    } catch (e) { return; }
    clearInterval(boot);
    call(P1 + '.bossModule', 'set', '_visible', false);
    ready = true;
    readyAt = performance.now();
    // The ready line names the checkout serving these pages (serve.py's X-OpenWillow-Pages header): the host shows the
    // movie only when that is its own checkout, since another worktree's server can answer on the same port.
    fetch('hud_fields.js', {cache: 'no-store'}).then(r => r.headers.get('X-OpenWillow-Pages') || 'unknown', () => 'unknown')
      .then(pages => console.log('OpenWillow HUD movie ready pages=' + pages));
    window.owHud({});
  }, 200);
</script></body></html>
