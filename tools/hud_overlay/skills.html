<!doctype html>
<!--
  OpenWillow skills screen: BL2's StatusMenu movie in Ruffle, on its Skills
  tab, driven by skills.js the way the game's skill tree controller drives it
  (observed in UI traces, DECISIONS.md 2026-09-26). Our own code; the movie,
  Ruffle and the skill tree data are served from ignored local/ by serve.py.
  Query: ?tree=siren (local/ui/run/skilltree_<tree>.json), &points=N for a
  standalone test; inside UE the host calls owSkills(state) instead.
-->
<html><head><meta charset="utf-8"><title>OpenWillow skills</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
ruffle-player{width:100%;height:100%;display:block}
#loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(8,31,58,.96),rgba(22,85,118,.88));
  color:#fff0b8;font:700 24px/1.3 Arial,sans-serif;text-shadow:2px 2px #11283d;
  letter-spacing:.04em;text-align:center;transition:opacity .3s ease}
#loading.finished{opacity:0;pointer-events:none}
#loading[hidden]{display:none}
#loading small{display:block;margin-top:12px;color:#c9eafa;font-size:14px;letter-spacing:0}
#hit-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.movie-hit{position:absolute;border:0;padding:0;background:transparent;pointer-events:auto;cursor:pointer}
.movie-hit:focus-visible{outline:2px solid #ffe25b;outline-offset:-2px}
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false,
    wmode: 'transparent', backgroundColor: null, letterbox: 'off', logLevel: 'error',
    contextMenu: 'off', allowScriptAccess: true };
</script>
<script src="ruffle/ruffle.js"></script>
</head><body>
<div id="hit-layer" aria-label="Maya skill tree controls"></div>
<div id="loading" role="status" aria-live="polite">SKILLS<small>Loading Maya's skill tree...</small></div>
<script src="skill_info.js"></script>
<script src="skills.js"></script>
</body></html>
